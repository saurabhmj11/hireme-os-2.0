version: "3.9"

services:
  # ---------- Hire Me OS 2.0 Application ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hire-me-os
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://hiremeos:hiremeos_secret@db:5432/hiremeos?schema=public
      - ENABLE_BACKGROUND_WORKER=true
      - CRON_SECRET=${CRON_SECRET:-change-me-in-production}
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hire-me-os-net

  # ---------- PostgreSQL Database ----------
  db:
    image: postgres:16-alpine
    container_name: hire-me-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hiremeos
      POSTGRES_PASSWORD: hiremeos_secret
      POSTGRES_DB: hiremeos
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiremeos -d hiremeos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hire-me-os-net

volumes:
  pgdata:
    driver: local

networks:
  hire-me-os-net:
    driver: bridge
